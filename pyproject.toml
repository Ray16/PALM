[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "palm"
version = "0.2.0"
description = "Physics-Aware Leakage Minimizer — scientifically rigorous train/test splitting"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "datasail",
    "pandas",
    "numpy",
    "pyyaml",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
]
molecules = [
    "rdkit",
]
materials = [
    "ase",
]
bio = [
    "biopython",
]
embeddings = [
    "torch",
    "transformers",
]
# The self-contained leakage-minimizing splitters (PALM.splitters): torch +
# Mt-KaHyPar back the hypergraph/graph/low-rank methods; rdkit is only needed for
# the scaffold splitter and ECFP leakage scoring.
splitters = [
    "torch",
    "mtkahypar",
    "rdkit",
    "scikit-learn",
    "scipy",
    "numpy<2",
]
# Dataset loaders (PALM.data): optional per-source clients.
datasets = [
    "PyTDC",         # Therapeutics Data Commons (tdc_*)
    "mp-api",        # Materials Project (needs MP_API_KEY)
    "ase",           # OMol25 / QMOF / OC22 structure parsing
    "lmdb",          # OC22 IS2RE LMDB reading
    "datasets",      # HuggingFace (genomic benchmarks)
    "h5py",          # LINCS L1000 GCTX (HDF5) reading
    "requests",      # direct-download loaders (qmof, oc22, lincs)
]
# Everything needed to fetch every dataset AND run the master benchmark in one
# env: `pip install -e ".[benchmark]"`. See data/README.md for the full flow.
benchmark = [
    "palm[splitters,datasets,molecules,materials]",
    "matplotlib",
]
all = [
    "palm[web,molecules,materials,bio,embeddings,splitters,datasets]",
    "matplotlib",
]
dev = [
    "palm[all]",
    "pytest",
]

[project.scripts]
palm-datasail = "PALM.benchmarks.datasail_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["PALM*"]
