[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "palm"
version = "0.2.0"
description = "Physics-Aware Leakage Minimizer — scientifically rigorous train/test splitting"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "datasail",
    "pandas",
    "numpy",
    "pyyaml",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
]
molecules = [
    "rdkit",
]
materials = [
    "ase",
]
bio = [
    "biopython",
]
embeddings = [
    "torch",
    "transformers",
]
# The self-contained leakage-minimizing splitters (PALM.splitters): torch +
# Mt-KaHyPar back the hypergraph/graph/low-rank methods; rdkit is only needed for
# the scaffold splitter and ECFP leakage scoring.
splitters = [
    "torch",
    "mtkahypar",
    "rdkit",
    "scikit-learn",
    "scipy",
    "numpy<2",
]
# Dataset loaders (PALM.data): optional per-source clients.
datasets = [
    "PyTDC",      # Therapeutics Data Commons
    "mp-api",     # Materials Project (needs MP_API_KEY)
    "ase",        # OMol25 / QMOF structure parsing
]
all = [
    "palm[web,molecules,materials,bio,embeddings,splitters]",
]
dev = [
    "palm[all]",
    "pytest",
]

[project.scripts]
palm = "PALM.__main__:main"

[tool.setuptools.packages.find]
include = ["PALM*"]
