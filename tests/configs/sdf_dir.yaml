# Directory of SDF files — 1D molecule splitting
input_file: "PALM/tests/data/sdf_dir"
output_dir: "PALM/tests/output/sdf_dir"
dataset_name: "sdf_dir"

e1:
  name: "compound"
  type: "molecule"
  extract:
    column: "smiles"
  feature_sets:
    - rdkit_descriptors

splitting:
  techniques: [R, C1e]
  splits: [8, 2]
  names: ["train", "test"]
  max_sec: 120
  solver: "SCIP"
